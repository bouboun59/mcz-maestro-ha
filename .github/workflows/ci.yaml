name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcz_maestro/requirements.txt pytest pyflakes
      - run: python -m pyflakes mcz_maestro/rootfs/app
      - run: python -m pytest -q tests

  lint:
    name: Lint de l'app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./mcz_maestro

  build:
    name: Build test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/mcz_maestro \
            --addon

  version-bump:
    # Home Assistant ne propose une mise à jour que si « version » change dans config.yaml
    name: Version incrémentée ?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^mcz_maestro/(rootfs|Dockerfile|requirements.txt|build.yaml)'; then
            if ! git diff HEAD~1 HEAD -- mcz_maestro/config.yaml | grep -q '^+version:'; then
              echo "::warning::Code modifié sans changement de version : Home Assistant ne proposera pas la mise à jour. Lancez scripts/release.sh"
            fi
          fi
